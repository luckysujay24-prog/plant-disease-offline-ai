AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  plant-disease-offline-ai - Optional Cloud Synchronization Layer
  Zero-cost serverless backend for crop disease diagnosis telemetry & backup.

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref PlantScansTable
        BUCKET_NAME: !Ref PlantScanImagesBucket
        NODE_OPTIONS: "--enable-source-maps"

Resources:
  # ==========================================
  # 1. Cognito Authentication (Zero Cost)
  # ==========================================
  FarmerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: crop-health-farmers
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false

  FarmerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: crop-health-pwa-client
      UserPoolId: !Ref FarmerUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ==========================================
  # 2. HTTP API Gateway with JWT Authorizer
  # ==========================================
  CropHealthHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowOrigins:
          - "*"
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FarmerUserPool}"
              audience:
                - !Ref FarmerUserPoolClient

  # ==========================================
  # 3. DynamoDB Table (Pay-Per-Request / Free Tier)
  # ==========================================
  PlantScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlantScans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: scanId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: scanId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ScanIdIndex
          KeySchema:
            - AttributeName: scanId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserCreatedAtIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ==========================================
  # 4. S3 Bucket for Diagnostic Images (Encrypted)
  # ==========================================
  PlantScanImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "crop-health-images-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - "*"
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldUploads
            Status: Enabled
            ExpirationInDays: 90

  # ==========================================
  # 5. Lambda Functions
  # ==========================================
  # Health check (Public - No Auth)
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/
      Handler: health.handler
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CropHealthHttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  # Create Scan (Idempotent POST - JWT Auth)
  CreateScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/
      Handler: create-scan.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlantScansTable
      Events:
        CreateScanApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CropHealthHttpApi
            Path: /scans
            Method: POST

  # S3 Presigned Upload URL Generator (JWT Auth)
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/
      Handler: get-upload-url.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref PlantScanImagesBucket
      Events:
        UploadUrlApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CropHealthHttpApi
            Path: /scans/{scanId}/upload-url
            Method: POST

  # List Farmer Scans (JWT Auth)
  ListScansFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/
      Handler: list-scans.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlantScansTable
      Events:
        ListScansApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CropHealthHttpApi
            Path: /scans
            Method: GET

Outputs:
  HttpApiUrl:
    Description: "Base URL for API Gateway"
    Value: !Sub "https://${CropHealthHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref FarmerUserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref FarmerUserPoolClient
  S3BucketName:
    Description: "Image Upload S3 Bucket"
    Value: !Ref PlantScanImagesBucket
